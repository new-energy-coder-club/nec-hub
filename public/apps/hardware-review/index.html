<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>硬件评审流程</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .view { display: none; }
  .view.active { display: block; }
  .status-badge {
    @apply text-xs px-2 py-1 rounded-full font-medium;
  }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-6">
    <!-- 顶部导航（embedded 模式隐藏） -->
    <header id="app-header" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-xl font-black text-slate-800">硬件评审流程</h1>
          <p class="text-xs text-gray-500">提交硬件评审单 → 预约会议 → 保存纪要 → 生成评审报告</p>
        </div>
        <nav class="flex gap-2">
          <button onclick="router('list')" class="nav-btn px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50" data-view="list">评审单</button>
          <button onclick="router('submit')" class="nav-btn px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50" data-view="submit">提交</button>
        </nav>
      </div>
    </header>

    <!-- 未配置提示 -->
    <div id="not-configured" class="hidden bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
      <p class="text-yellow-800 font-medium">流程尚未配置</p>
      <p class="text-sm text-yellow-700">请先让 Agent 调用 MCP 的 config_hardware_review 配置 Base 表。</p>
    </div>

    <!-- 提交视图 -->
    <section id="view-submit" class="view">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-lg font-bold text-slate-800 mb-4">提交硬件评审单</h2>
        <form id="submit-form" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">项目编号</label>
              <input type="text" name="projectId" required class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="PRJ-2026-001" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">硬件名称</label>
              <input type="text" name="hardwareName" required class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="主控板 / 激光雷达 / 驱动电机" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">硬件类型</label>
              <select name="hardwareType" class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm">
                <option value="controller">控制器</option>
                <option value="sensor">传感器</option>
                <option value="actuator">执行器</option>
                <option value="motor">电机/驱动</option>
                <option value="power">电源/电池</option>
                <option value="communication">通信模块</option>
                <option value="structure">结构件</option>
                <option value="other" selected>其他</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">硬件版本</label>
              <input type="text" name="hardwareVersion" required class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="V1.0" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">设计负责人 open_id</label>
              <input type="text" name="designerId" required class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="ou_xxx" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">规格参数</label>
            <textarea name="specification" rows="2" class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="电压 / 电流 / 功率 / 接口 / 防护等级等"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">设计说明</label>
            <textarea name="designNotes" rows="3" required class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="选型理由、关键设计点、风险与验证计划"></textarea>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg">提交评审单</button>
          </div>
        </form>
        <p id="submit-result" class="mt-3 text-sm"></p>
      </div>
    </section>

    <!-- 评审单视图（列表 / 看板 一体） -->
    <section id="view-list" class="view active">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-800">评审单</h2>
          <div class="flex items-center gap-2">
            <div class="flex rounded-lg border border-gray-200 overflow-hidden text-sm">
              <button id="mode-board" onclick="setDisplayMode('board')" class="px-3 py-1.5">看板</button>
              <button id="mode-table" onclick="setDisplayMode('table')" class="px-3 py-1.5 border-l border-gray-200">列表</button>
            </div>
            <button onclick="loadReviews()" class="text-sm text-blue-600 hover:text-blue-700 font-medium px-2">刷新</button>
          </div>
        </div>
        <div id="dashboard" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
          <p class="text-sm text-gray-400 md:col-span-3 lg:col-span-4">加载中…</p>
        </div>
        <div id="review-list" class="space-y-3 hidden">
        </div>
      </div>
    </section>

    <!-- 详情视图 -->
    <section id="view-detail" class="view">
      <div class="mb-4">
        <button onclick="router('list')" class="text-sm text-blue-600 hover:underline">← 返回评审单</button>
      </div>
      <div id="detail-content" class="space-y-4">
        <p class="text-sm text-gray-400">加载中…</p>
      </div>
    </section>
  </div>

  <script>
    // embedded 模式：被 hub 主界面 iframe 嵌入时隐藏自身顶栏、收窄边距
    (function () {
      const params = new URLSearchParams(location.search);
      const embedded = params.get("embedded") === "1" || window.parent !== window;
      if (embedded) {
        const header = document.getElementById("app-header");
        if (header) header.style.display = "none";
        document.body.classList.remove("bg-gray-50");
        const wrap = document.querySelector("body > div.max-w-5xl");
        if (wrap) wrap.classList.remove("px-4", "py-6");
      }
    })();

    const API = "";
    const statusMap = {
      draft: { label: "待提交", color: "bg-gray-100 text-gray-700" },
      pending_review: { label: "待评审", color: "bg-blue-50 text-blue-700" },
      in_review: { label: "评审中", color: "bg-yellow-50 text-yellow-700" },
      rectifying: { label: "待整改", color: "bg-orange-50 text-orange-700" },
      report_generating: { label: "报告生成中", color: "bg-purple-50 text-purple-700" },
      assessing: { label: "评估中", color: "bg-indigo-50 text-indigo-700" },
      approved: { label: "已通过", color: "bg-green-50 text-green-700" },
      archived: { label: "已归档", color: "bg-slate-100 text-slate-600" },
    };
    const typeMap = {
      controller: "控制器",
      sensor: "传感器",
      actuator: "执行器",
      motor: "电机/驱动",
      power: "电源/电池",
      communication: "通信模块",
      structure: "结构件",
      other: "其他",
    };

    function router(view, params = {}) {
      document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
      document.getElementById(`view-${view}`).classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("bg-blue-50", btn.dataset.view === view);
        btn.classList.toggle("border-blue-200", btn.dataset.view === view);
      });
      if (view === "list") loadReviews();
      if (view === "detail" && params.id) loadDetail(params.id);
    }

    let displayMode = "board";
    function setDisplayMode(mode) {
      displayMode = mode;
      document.getElementById("dashboard").classList.toggle("hidden", mode !== "board");
      document.getElementById("review-list").classList.toggle("hidden", mode !== "table");
      for (const m of ["board", "table"]) {
        const btn = document.getElementById(`mode-${m}`);
        btn.classList.toggle("bg-blue-50", m === mode);
        btn.classList.toggle("text-blue-700", m === mode);
        btn.classList.toggle("font-medium", m === mode);
      }
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API}${path}`, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function getConfig() {
      return api("/api/hardware-review/config");
    }

    function renderStatus(status) {
      const s = statusMap[status] || { label: status, color: "bg-gray-100 text-gray-700" };
      return `<span class="status-badge ${s.color}">${s.label}</span>`;
    }

    function renderType(t) {
      return typeMap[t] || t || "其他";
    }

    async function loadReviews() {
      const listEl = document.getElementById("review-list");
      const boardEl = document.getElementById("dashboard");
      try {
        const data = await api("/api/hardware-review");
        renderList(data);
        renderBoard(data);
      } catch (err) {
        const msg = `<p class="text-sm text-red-500">加载失败：${err.message}</p>`;
        listEl.innerHTML = msg;
        boardEl.innerHTML = `<p class="text-sm text-red-500 md:col-span-3 lg:col-span-4">加载失败：${err.message}</p>`;
      }
    }

    function renderList(data) {
      const listEl = document.getElementById("review-list");
      if (!data.length) {
        listEl.innerHTML = `<p class="text-sm text-gray-400">暂无评审单</p>`;
        return;
      }
      listEl.innerHTML = data.map(r => `
          <div class="border border-gray-100 rounded-lg p-4 hover:bg-gray-50 cursor-pointer" onclick="router('detail', {id:'${r.reviewId}'})">
            <div class="flex items-center justify-between">
              <div>
                <p class="font-bold text-slate-800">${r.reviewId} · ${r.hardwareName}</p>
                <p class="text-xs text-gray-500">项目：${r.projectId} · 类型：${renderType(r.hardwareType)} · 版本：${r.hardwareVersion}</p>
              </div>
              ${renderStatus(r.status)}
            </div>
            <p class="text-sm text-gray-600 mt-2 line-clamp-2">${r.designNotes}</p>
            <div class="mt-3 flex gap-2 text-xs">
              <span class="text-gray-400">负责人：${r.designerId}</span>
              ${r.meetingLink ? `<a href="${r.meetingLink}" target="_blank" class="text-blue-600 hover:underline" onclick="event.stopPropagation()">会议链接</a>` : ""}
            </div>
          </div>
        `).join("");
    }

    function renderBoard(data) {
      const el = document.getElementById("dashboard");
      const groups = {};
      for (const r of data) {
        groups[r.status] = groups[r.status] || [];
        groups[r.status].push(r);
      }
      const columns = Object.keys(statusMap).map(status => ({
        status,
        ...statusMap[status],
        items: groups[status] || []
      }));
      el.innerHTML = columns.map(col => `
          <div class="bg-gray-50 rounded-lg p-3">
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm font-bold text-slate-700">${col.label}</span>
              <span class="text-xs text-gray-500">${col.items.length}</span>
            </div>
            <div class="space-y-2">
              ${col.items.map(r => `
                <div class="bg-white border border-gray-100 rounded p-3 cursor-pointer hover:shadow-sm" onclick="router('detail', {id:'${r.reviewId}'})">
                  <p class="text-sm font-medium text-slate-800 truncate">${r.hardwareName}</p>
                  <p class="text-xs text-gray-500">${r.reviewId}</p>
                </div>
              `).join("") || `<p class="text-xs text-gray-400 text-center py-4">无</p>`}
            </div>
          </div>
        `).join("");
    }

    async function loadDetail(reviewId) {
      const el = document.getElementById("detail-content");
      try {
        const r = await api(`/api/hardware-review/${reviewId}`);
        el.innerHTML = `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <div class="flex items-start justify-between">
              <div>
                <h2 class="text-xl font-bold text-slate-800">${r.hardwareName}</h2>
                <p class="text-sm text-gray-500">${r.reviewId} · 项目 ${r.projectId} · ${renderType(r.hardwareType)} · 版本 ${r.hardwareVersion}</p>
              </div>
              ${renderStatus(r.status)}
            </div>
            <div class="mt-4 grid grid-cols-2 gap-4 text-sm">
              <div><span class="text-gray-500">设计负责人：</span>${r.designerId}</div>
              <div><span class="text-gray-500">创建时间：</span>${new Date(r.createdAt).toLocaleString()}</div>
              ${r.meetingId ? `<div><span class="text-gray-500">会议号：</span>${r.meetingId}</div>` : ""}
              ${r.meetingStartTime ? `<div><span class="text-gray-500">会议时间：</span>${new Date(r.meetingStartTime).toLocaleString()}</div>` : ""}
            </div>
            ${r.specification ? `<div class="mt-4"><h3 class="text-sm font-bold text-slate-700 mb-2">规格参数</h3><p class="text-sm text-gray-600 whitespace-pre-wrap">${r.specification}</p></div>` : ""}
            <div class="mt-4">
              <h3 class="text-sm font-bold text-slate-700 mb-2">设计说明</h3>
              <p class="text-sm text-gray-600 whitespace-pre-wrap">${r.designNotes}</p>
            </div>
            ${r.meetingLink ? `<div class="mt-4"><a href="${r.meetingLink}" target="_blank" class="text-sm text-blue-600 hover:underline">加入腾讯会议 →</a></div>` : ""}
          </div>

          <!-- 操作区 -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h3 class="text-sm font-bold text-slate-700 mb-3">状态操作</h3>
            <div class="flex flex-wrap gap-2">
              ${renderActionButtons(r)}
            </div>
          </div>

          <!-- 会议纪要 -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h3 class="text-sm font-bold text-slate-700 mb-3">保存会议纪要</h3>
            <form onsubmit="saveMinutes(event, '${r.reviewId}')" class="space-y-3">
              <div>
                <label class="block text-xs text-gray-500 mb-1">会议时间</label>
                <input type="datetime-local" name="meetingTime" required class="w-full rounded border-gray-300 border px-3 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs text-gray-500 mb-1">讨论记录</label>
                <textarea name="discussion" rows="3" required class="w-full rounded border-gray-300 border px-3 py-2 text-sm"></textarea>
              </div>
              <div>
                <label class="block text-xs text-gray-500 mb-1">评审结论</label>
                <select name="conclusion" class="w-full rounded border-gray-300 border px-3 py-2 text-sm">
                  <option value="passed">通过</option>
                  <option value="conditional">有条件通过</option>
                  <option value="rejected">不通过</option>
                </select>
              </div>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">保存纪要并提交结论</button>
            </form>
            <p id="minutes-result" class="mt-2 text-sm"></p>
          </div>

          <!-- 评审报告生成 -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h3 class="text-sm font-bold text-slate-700 mb-3">生成评审报告</h3>
            <form onsubmit="generateReport(event, '${r.reviewId}')" class="space-y-3">
              <div>
                <label class="block text-xs text-gray-500 mb-1">总结</label>
                <textarea name="summary" rows="2" class="w-full rounded border-gray-300 border px-3 py-2 text-sm" placeholder="评审总结"></textarea>
              </div>
              <div>
                <label class="block text-xs text-gray-500 mb-1">检查清单 JSON</label>
                <textarea name="checklist" rows="4" required class="w-full rounded border-gray-300 border px-3 py-2 text-sm font-mono" placeholder='[{"item":"电气安全","category":"安全","result":"pass"},{"item":"接口兼容性","result":"na"}]'></textarea>
              </div>
              <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium px-4 py-2 rounded-lg">生成报告</button>
            </form>
            <p id="report-result" class="mt-2 text-sm"></p>
          </div>
        `;
      } catch (err) {
        el.innerHTML = `<p class="text-sm text-red-500">加载失败：${err.message}</p>`;
      }
    }

    function renderActionButtons(r) {
      const buttons = [];
      if (r.status === "pending_review") {
        buttons.push(`<button onclick="scheduleMeeting('${r.reviewId}')" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg">预约会议</button>`);
      }
      if (r.status === "rectifying") {
        buttons.push(`<button onclick="completeRectify('${r.reviewId}')" class="bg-orange-600 text-white text-xs px-3 py-1.5 rounded-lg">整改完成</button>`);
      }
      if (r.status === "assessing") {
        buttons.push(`<button onclick="assess('${r.reviewId}', 'pass')" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg">评估通过</button>`);
        buttons.push(`<button onclick="assess('${r.reviewId}', 'fail')" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg">评估不通过</button>`);
      }
      if (r.status === "approved") {
        buttons.push(`<button onclick="archive('${r.reviewId}')" class="bg-slate-600 text-white text-xs px-3 py-1.5 rounded-lg">归档</button>`);
      }
      return buttons.join("") || `<span class="text-xs text-gray-400">当前状态无可用操作</span>`;
    }

    async function scheduleMeeting(reviewId) {
      try {
        const data = await api(`/api/hardware-review/${reviewId}/meeting`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({}),
        });
        alert(`会议已创建：${data.meeting?.meetingLink || "mock"}`);
        loadDetail(reviewId);
      } catch (err) {
        alert("预约失败：" + err.message);
      }
    }

    async function completeRectify(reviewId) {
      try {
        await api(`/api/hardware-review/${reviewId}/rectify`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({}),
        });
        loadDetail(reviewId);
      } catch (err) {
        alert("操作失败：" + err.message);
      }
    }

    async function assess(reviewId, result) {
      try {
        await api(`/api/hardware-review/${reviewId}/assess`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ result }),
        });
        loadDetail(reviewId);
      } catch (err) {
        alert("操作失败：" + err.message);
      }
    }

    async function archive(reviewId) {
      try {
        await api(`/api/hardware-review/${reviewId}/archive`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({}),
        });
        loadDetail(reviewId);
      } catch (err) {
        alert("操作失败：" + err.message);
      }
    }

    async function saveMinutes(e, reviewId) {
      e.preventDefault();
      const form = e.target;
      try {
        await api(`/api/hardware-review/${reviewId}/minutes`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            meetingTime: new Date(form.meetingTime.value).toISOString(),
            discussion: form.discussion.value,
            attendees: [],
            topics: [],
            issues: [],
            nextActions: [],
            conclusion: form.conclusion.value,
            attachments: [],
          }),
        });
        await api(`/api/hardware-review/${reviewId}/conclusion`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ conclusion: form.conclusion.value }),
        });
        document.getElementById("minutes-result").className = "mt-2 text-sm text-green-600";
        document.getElementById("minutes-result").textContent = "纪要与结论已保存";
        loadDetail(reviewId);
      } catch (err) {
        document.getElementById("minutes-result").className = "mt-2 text-sm text-red-600";
        document.getElementById("minutes-result").textContent = "失败：" + err.message;
      }
    }

    async function generateReport(e, reviewId) {
      e.preventDefault();
      const form = e.target;
      try {
        const checklist = JSON.parse(form.checklist.value);
        const data = await api(`/api/hardware-review/${reviewId}/report/generate`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ summary: form.summary.value, checklist }),
        });
        document.getElementById("report-result").className = "mt-2 text-sm text-green-600";
        document.getElementById("report-result").textContent = `报告已生成：${data.reportId}，结果 ${data.result}`;
        loadDetail(reviewId);
      } catch (err) {
        document.getElementById("report-result").className = "mt-2 text-sm text-red-600";
        document.getElementById("report-result").textContent = "失败：" + err.message;
      }
    }

    document.getElementById("submit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const resultEl = document.getElementById("submit-result");
      try {
        const data = await api("/api/hardware-review/submit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            projectId: form.projectId.value,
            hardwareName: form.hardwareName.value,
            hardwareType: form.hardwareType.value,
            hardwareVersion: form.hardwareVersion.value,
            designerId: form.designerId.value,
            hardwareFiles: [{ name: "硬件资料", token: "manual" }],
            designNotes: form.designNotes.value,
            specification: form.specification.value,
          }),
        });
        resultEl.className = "mt-3 text-sm text-green-600";
        resultEl.textContent = `提交成功：${data.reviewId}`;
        form.reset();
        router("list");
      } catch (err) {
        resultEl.className = "mt-3 text-sm text-red-600";
        resultEl.textContent = "失败：" + err.message;
      }
    });

    async function init() {
      const cfg = await getConfig();
      if (!cfg.configured) {
        document.getElementById("not-configured").classList.remove("hidden");
      }
      setDisplayMode("board");
      loadReviews();
    }

    init();
  </script>
</body>
</html>
