<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新增机图纸评审流程 · NEC HUB</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="stylesheet" href="/brand/nec-tokens.css" />
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
<link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // VI 规范：把 NEC 品牌 tokens 映射进 Tailwind，不使用默认蓝/青色系
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          nec: {
            royal: "#1A2FA0",
            "royal-light": "#3449B9",
            "royal-dark": "#10277E",
            "royal-100": "#E8ECFB",
            navy: "#141B5E",
            ink: "#0B1033",
            cyan: "#1FA9E8",
            sky: "#4FC3F7",
            fog: "#F4F6FB",
            gray: "#5A6472",
            line: "#D9DFF0",
          },
        },
        fontFamily: {
          sans: ["Source Han Sans SC", "思源黑体 CN", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"],
          mono: ["IBM Plex Mono", "ui-monospace", "Consolas", "monospace"],
        },
      },
    },
  };
</script>
<style>
  body { font-family: var(--nec-font-cn); background: var(--nec-fog); color: var(--nec-ink); }
  .mono { font-family: var(--nec-font-mono); }

  .status-badge {
    @apply text-xs px-2 py-1 rounded-full font-medium;
  }

  /* KV：蓝图网格 Hero（只铺在头部区域） */
  .hero {
    position: relative; overflow: hidden;
    background-color: var(--nec-paper);
    background-image:
      linear-gradient(var(--nec-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--nec-grid) 1px, transparent 1px),
      linear-gradient(var(--nec-grid-fine) 1px, transparent 1px),
      linear-gradient(90deg, var(--nec-grid-fine) 1px, transparent 1px);
    background-size: 92px 92px, 92px 92px, 23px 23px, 23px 23px;
  }
  .hero-title { font-weight: 900; letter-spacing: -.015em; color: var(--nec-ink); }
  .hero-title .accent { color: var(--nec-cyan); }
  .horizon { position: absolute; left: 0; right: 0; bottom: 30px; height: 3px; background: var(--nec-cyan); }
  .base-line { height: 5px; background: var(--nec-horizon); }

  /* 卡片：NEC 圆角与阴影 */
  .nec-card {
    background: var(--nec-paper);
    border: 1px solid var(--nec-line);
    border-radius: var(--nec-radius);
    box-shadow: var(--nec-shadow);
  }

  /* 导航按钮 */
  .nav-btn { border: 1.5px solid var(--nec-line); color: var(--nec-gray); background: var(--nec-paper); }
  .nav-btn:hover { border-color: var(--nec-cyan); color: var(--nec-navy); }
  .nav-btn.on { border-color: var(--nec-navy); color: #fff; background: var(--nec-navy); }

  /* 主按钮 */
  .btn-primary { background: var(--nec-royal); color: #fff; }
  .btn-primary:hover { background: var(--nec-royal-700, #10277E); }
  .btn-accent { background: var(--nec-cyan); color: #fff; }
  .btn-accent:hover { background: #1891c9; }

  /* 链接与交互统一破晓青 */
  a, .link { color: var(--nec-cyan); }
  a:hover { color: #1891c9; }

  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--nec-cyan) !important;
    box-shadow: 0 0 0 3px rgba(31, 169, 232, .15);
  }

  /* ---- 移动端适配 Mobile ---- */
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  /* iOS Safari：输入框 font-size < 16px 会触发自动放大 */
  input, textarea, select { font-size: 16px; }
  @media (min-width: 640px) { input, textarea, select { font-size: inherit; } }
  @media (max-width: 639px) {
    button, a[class*="rounded"], [role="button"] { touch-action: manipulation; }
    .nav-btn { min-height: 40px; display: inline-flex; align-items: center; }
  }
  .overflow-x-auto { -webkit-overflow-scrolling: touch; }
</style>
</head>
<body class="min-h-screen">
<div id="app"></div>
<script type="module" src="/src/apps/drawing-review/main.ts"></script>
</body>
</html>
