<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="PingFang SC, Hiragino Sans GB, sans-serif"><rect width="1180" height="660" fill="#fff"/><rect x="8" y="8" width="1164" height="644" fill="none" stroke="#333" stroke-width="2"/><text x="590" y="40" font-size="22" font-weight="bold" text-anchor="middle">6014 电机尾部转接板 · 评审草图（示意，非加工图）</text><text x="590" y="64" font-size="12" fill="#555" text-anchor="middle">数据来源：6014环抱安装.step / 6014赛事推荐安装.step 实测提取（SolidWorks 模型，单位 mm）｜视图方向：从电机尾部(-X)正视，横轴=电机Y，纵轴=电机Z</text><circle cx="300.0" cy="300.0" r="136.5" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="10 4 2 4"/><circle cx="300.0" cy="300.0" r="134.8" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="4 4"/><circle cx="300.0" cy="300.0" r="168.0" fill="none" stroke="#222" stroke-width="2.5"/><circle cx="300.0" cy="300.0" r="75.6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 3"/><circle cx="300.0" cy="300.0" r="69.3" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="10 4 2 4"/><circle cx="300.0" cy="300.0" r="50.4" fill="none" stroke="#1a5fb4" stroke-width="2"/><circle cx="360.0" cy="265.4" r="9.5" fill="none" stroke="#1a5fb4" stroke-width="2"/><line x1="353.0138" y1="265.35" x2="367.0138" y2="265.35" stroke="#1a5fb4" stroke-width="1"/><line x1="360.0138" y1="258.35" x2="360.0138" y2="272.35" stroke="#1a5fb4" stroke-width="1"/><circle cx="300.0" cy="230.7" r="9.5" fill="none" stroke="#1a5fb4" stroke-width="2"/><line x1="293.0" y1="230.7" x2="307.0" y2="230.7" stroke="#1a5fb4" stroke-width="1"/><line x1="300.0" y1="223.7" x2="300.0" y2="237.7" stroke="#1a5fb4" stroke-width="1"/><circle cx="240.0" cy="265.4" r="9.5" fill="none" stroke="#1a5fb4" stroke-width="2"/><line x1="232.9862" y1="265.35" x2="246.9862" y2="265.35" stroke="#1a5fb4" stroke-width="1"/><line x1="239.9862" y1="258.35" x2="239.9862" y2="272.35" stroke="#1a5fb4" stroke-width="1"/><circle cx="240.0" cy="334.6" r="9.5" fill="none" stroke="#1a5fb4" stroke-width="2"/><line x1="232.9862" y1="334.65" x2="246.9862" y2="334.65" stroke="#1a5fb4" stroke-width="1"/><line x1="239.9862" y1="327.65" x2="239.9862" y2="341.65" stroke="#1a5fb4" stroke-width="1"/><circle cx="300.0" cy="369.3" r="9.5" fill="none" stroke="#1a5fb4" stroke-width="2"/><line x1="293.0" y1="369.3" x2="307.0" y2="369.3" stroke="#1a5fb4" stroke-width="1"/><line x1="300.0" y1="362.3" x2="300.0" y2="376.3" stroke="#1a5fb4" stroke-width="1"/><circle cx="360.0" cy="334.6" r="9.5" fill="none" stroke="#1a5fb4" stroke-width="2"/><line x1="353.0138" y1="334.65" x2="367.0138" y2="334.65" stroke="#1a5fb4" stroke-width="1"/><line x1="360.0138" y1="327.65" x2="360.0138" y2="341.65" stroke="#1a5fb4" stroke-width="1"/><circle cx="233.6" cy="300.0" r="10.5" fill="none" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4 2"/><circle cx="333.2" cy="242.5" r="10.5" fill="none" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4 2"/><circle cx="333.2" cy="357.5" r="10.5" fill="none" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4 2"/><circle cx="442.8" cy="157.2" r="11.6" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="157.2" cy="157.2" r="11.6" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="157.2" cy="442.8" r="11.6" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><circle cx="442.8" cy="442.8" r="11.6" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/><line x1="115.19999999999999" y1="300.0" x2="484.8" y2="300.0" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="10 4 2 4"/><line x1="300.0" y1="484.8" x2="300.0" y2="115.19999999999999" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="10 4 2 4"/><line x1="300.0" y1="300.0" x2="300.0" y2="230.7" stroke="#c0392b" stroke-width="0.8"/><text x="308.0" y="253.8" font-size="11" fill="#c0392b">R16.5 (PCD Ø33)</text><text x="384.0" y="211.8" font-size="11" fill="#c0392b">孔位偏置 30°（90°方向有孔，0°/180°无孔）</text><line x1="360" y1="265" x2="500" y2="120" stroke="#333" stroke-width="0.8"/><text x="500" y="114" font-size="12" fill="#111" text-anchor="start">6× Ø4.5 通孔（M4 过孔）@ PCD Ø33.000</text><text x="500" y="129" font-size="12" fill="#111" text-anchor="start">攻入电机尾部 M4 螺孔（STEP 实测底孔 Ø3.3）</text><text x="500" y="144" font-size="12" fill="#111" text-anchor="start">赛事版模型同位置为 Ø4.0 通孔→实物需确认是否已攻丝</text><line x1="300" y1="350" x2="500" y2="190" stroke="#333" stroke-width="0.8"/><text x="500" y="184" font-size="12" fill="#111" text-anchor="start">Ø24 走线/止口孔（电机尾部中心 Ø22/23 凹槽对应）</text><line x1="247" y1="353" x2="30" y2="480" stroke="#333" stroke-width="0.8"/><text x="30" y="474" font-size="12" fill="#111" text-anchor="start">Ø36×3.5 中心沉台（电机侧）：避让尾部凸出特征</text><text x="30" y="489" font-size="12" fill="#111" text-anchor="start">（STEP 中最尾端面 x=-39.8，较 M4 孔环面 x=-36.8</text><text x="30" y="504" font-size="12" fill="#111" text-anchor="start">凸出 3.0，实物待核）</text><line x1="443" y1="443" x2="640" y2="480" stroke="#333" stroke-width="0.8"/><text x="640" y="474" font-size="12" fill="#111" text-anchor="start">4× Ø5.5 @ 68×68（机体接口，示意）</text><text x="640" y="489" font-size="12" fill="#111" text-anchor="start">按实际机体孔位定</text><line x1="468" y1="300" x2="640" y2="300" stroke="#333" stroke-width="0.8"/><text x="640" y="294" font-size="12" fill="#111" text-anchor="start">板：Ø80 × t4，6061-T6</text><text x="640" y="309" font-size="12" fill="#111" text-anchor="start">（外形示意，可按机体改）</text><text x="30" y="92" font-size="11.5" fill="#c0392b">红虚线 = 电机尾帽外径 Ø65 / PCD Ø33 中心线（参考）</text><text x="30" y="109" font-size="11.5" fill="#e67e22">橙虚线 = 通风孔分布圆 PCD Ø64.2（12×Ø2.2，转接板勿封堵，建议开通风槽/镂空）</text><text x="30" y="126" font-size="11.5" fill="#7d3c98">紫虚线 = 电机侧 3×M6 底孔（Ø5.0）@ PCD Ø31.6（端面 x=-39.8，备选接口，非板孔）</text><text x="830" y="100" font-size="14" font-weight="bold">电机尾部孔位实测（电机坐标系，mm）</text><rect x="824" y="107" width="364" height="18" fill="#eee"/><text x="830" y="120" font-size="11" font-weight="bold">孔组</text><text x="916" y="120" font-size="11" font-weight="bold">Y</text><text x="988" y="120" font-size="11" font-weight="bold">Z</text><text x="1060" y="120" font-size="11" font-weight="bold">ρ</text><text x="1126" y="120" font-size="11" font-weight="bold">角度</text><text x="830" y="138" font-size="11" >H1 (M4)</text><text x="916" y="138" font-size="11" >14.289</text><text x="988" y="138" font-size="11" >8.250</text><text x="1060" y="138" font-size="11" >16.500</text><text x="1126" y="138" font-size="11" >30°</text><text x="830" y="156" font-size="11" >H2 (M4)</text><text x="916" y="156" font-size="11" >0.000</text><text x="988" y="156" font-size="11" >16.500</text><text x="1060" y="156" font-size="11" >16.500</text><text x="1126" y="156" font-size="11" >90°</text><text x="830" y="174" font-size="11" >H3 (M4)</text><text x="916" y="174" font-size="11" >-14.289</text><text x="988" y="174" font-size="11" >8.250</text><text x="1060" y="174" font-size="11" >16.500</text><text x="1126" y="174" font-size="11" >150°</text><text x="830" y="192" font-size="11" >H4 (M4)</text><text x="916" y="192" font-size="11" >-14.289</text><text x="988" y="192" font-size="11" >-8.250</text><text x="1060" y="192" font-size="11" >16.500</text><text x="1126" y="192" font-size="11" >-150°</text><text x="830" y="210" font-size="11" >H5 (M4)</text><text x="916" y="210" font-size="11" >0.000</text><text x="988" y="210" font-size="11" >-16.500</text><text x="1060" y="210" font-size="11" >16.500</text><text x="1126" y="210" font-size="11" >-90°</text><text x="830" y="228" font-size="11" >H6 (M4)</text><text x="916" y="228" font-size="11" >14.289</text><text x="988" y="228" font-size="11" >-8.250</text><text x="1060" y="228" font-size="11" >16.500</text><text x="1126" y="228" font-size="11" >-30°</text><text x="830" y="246" font-size="11" >M1 (M6)</text><text x="916" y="246" font-size="11" >-15.800</text><text x="988" y="246" font-size="11" >0.000</text><text x="1060" y="246" font-size="11" >15.800</text><text x="1126" y="246" font-size="11" >180°</text><text x="830" y="264" font-size="11" >M2 (M6)</text><text x="916" y="264" font-size="11" >7.900</text><text x="988" y="264" font-size="11" >13.683</text><text x="1060" y="264" font-size="11" >15.800</text><text x="1126" y="264" font-size="11" >60°</text><text x="830" y="282" font-size="11" >M3 (M6)</text><text x="916" y="282" font-size="11" >7.900</text><text x="988" y="282" font-size="11" >-13.683</text><text x="1060" y="282" font-size="11" >15.800</text><text x="1126" y="282" font-size="11" >-60°</text><text x="830" y="308" font-size="10.5" fill="#555">注：M4 组 6 孔 60° 均布、偏置 30°；M6 组 3 孔 @ PCD Ø31.6，</text><text x="830" y="324" font-size="10.5" fill="#555">位于更尾端面 x=-39.8（与 M4 面台阶 3.0），方案备选。</text><text x="30" y="560" font-size="11.5" fill="#333">评审要点：① 三份官方 STEP 均显示尾部存在 6 孔 @ PCD Ø33 安装接口（环抱/快速版为 M4 底孔 Ø3.3，赛事版为 Ø4.0 通孔）；</text><text x="30" y="577" font-size="11.5" fill="#333">② 尾端面存在 3mm 台阶与 Ø31.6 的 3×M6 孔组，转接板中心沉台尺寸需对照实物端盖确认；</text><text x="30" y="594" font-size="11.5" fill="#333">③ 通风孔环（PCD Ø64.2）位于同一环面，板体应开槽避让；④ 板外形与机体接口孔位为示意，按整机布局定。</text></svg>